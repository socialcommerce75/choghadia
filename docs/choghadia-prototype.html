.xp{animation:rise .25s ease-out}
.dt i{animation:bob .8s infinite}
.dt i:nth-child(2){animation-delay:.12s}
.dt i:nth-child(3){animation-delay:.24s}
.pw2{animation:rise .45s 2.3s backwards}
